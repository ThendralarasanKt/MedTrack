[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medtrack-gateway"
version = "0.1.0"
description = "MedTrack authenticated inference gateway. No clinical commit endpoint."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "PyJWT>=2.9",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[project.scripts]
medtrack-gateway = "medtrack_gateway.app:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["medtrack_gateway*"]
